# .github/workflows/ci.yml
# Continuous Integration pipeline — runs on every push and pull request.
# Checks: type checking, linting, and formatting.
# This catches bugs before they reach production without needing to run the full app.

name: CI

# Trigger on every push and pull request to any branch
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  check:
    name: Type Check, Lint, Format, Test & Build
    runs-on: ubuntu-latest

    # A throwaway database for the build step.
    #
    # `next build` prerenders pages that query the database (/admin/stories is
    # one), so a placeholder connection string is not enough — the build fails
    # with a connection-pool timeout. This gives it a real server to talk to.
    # Image version matches the 10.4 series running in development.
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: silent_evidence
        ports:
          - 3306:3306
        # Steps must not start until the server is actually accepting
        # connections, or the migrate step races it and fails intermittently.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Shared by every step that needs them. These are throwaway CI values: the
      # database is destroyed with the runner, and no real session is ever issued
      # with this secret.
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/silent_evidence
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      SESSION_SECRET: ci-build-only-secret-not-used-for-real-sessions

    steps:
      # 1. Check out the code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node.js — matches the version used locally
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Cache npm dependencies so subsequent runs are faster
          cache: 'npm'

      # 3. Install dependencies (uses package-lock.json for reproducible installs)
      - name: Install dependencies
        run: npm ci

      # 4. TypeScript type check — catches type errors without building
      #    The Prisma client is already generated by the postinstall hook that
      #    `npm ci` runs, so its types resolve here without an extra step.
      - name: TypeScript type check
        run: npm run typecheck

      # 5. ESLint — catches code quality and style issues
      - name: Lint
        run: npm run lint

      # 6. Prettier — checks formatting without modifying files
      #    Fails if any file isn't formatted correctly
      - name: Check formatting
        run: npm run format:check

      # 7. Apply migrations BEFORE the tests. Several suites are integration tests
      #    that talk to the MariaDB service above (search, appeals, earnings, etc.),
      #    so the tables must exist first. (The build in step 9 relies on this too.)
      - name: Apply migrations
        run: npx prisma migrate deploy

      # 8. Vitest — unit + DB-backed integration tests in tests/
      - name: Test
        run: npm test

      # 8. Production build — the only check that compiles the app the way it
      #    actually ships.
      #
      #    This is NOT redundant with the type check above. `tsc --noEmit` reads
      #    the source in isolation; `next build` additionally resolves every
      #    route, runs the App Router's own validation, and type-checks the
      #    generated route manifest. A component that is referenced but never
      #    defined passes tsc and fails here — which is precisely how a broken
      #    production build once sat in this repo while CI stayed green.
      #
      #    Runs last because it is the slowest step, so the cheap checks fail
      #    fast and this only runs when they have all passed. Migrations were
      #    already applied before the test step, so the prerendered pages that
      #    query real tables have a populated schema to talk to.
      # 9. Production build — the only check that compiles the app as it ships.
      - name: Production build
        run: npm run build
